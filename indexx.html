<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Local Storeage wala</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body
    class="d-flex justify-content-center align-items-center vh-100"
    
  >
    <div
      class="container d-flex justify-content-center align-items-center flex-column p-5 border-dark border-3 rounded shadow-sm"
      style="background-color: #ffffff"
    >
      <h2><span>Todo List.</span></h2>

      <div class="input-group mb-3 w-50">
        <input
          type="text"
          id="userInput"
          class="form-control"
          placeholder="Recipient’s username"
          width="10"
        />
        <button
          class="btn btn-outline-secondary"
          type="button"
          id="button"
          onclick="addTask()"
        >
          Add
        </button>
      </div>
      <ul id="allTasks" class="list-group py-1 px-5"></ul>
    </div>
  </body>
  <script src="script.js">  </script>
</html>
